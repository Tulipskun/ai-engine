name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./agent/... ./io/... ./provider/... ./session/... ./tools/... -timeout 2m
      - name: Build
        run: |
          set -e
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_SHA" -o "dist/ai-engine-linux-$arch" ./main.go
          done
          sha256sum dist/ai-engine-linux-* > dist/checksums.txt
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/ai-engine-linux-amd64 dist/ai-engine-linux-arm64 dist/checksums.txt             --title "ai-engine latest"             --notes "Latest tested build from $GITHUB_SHA."             --latest
